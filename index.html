<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#5b18d6">
<title>PayFast — Demo</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

html,body{
  margin:0;
  width:100%;
  min-height:100%;
  font-family:Arial,Helvetica,sans-serif;
  background:#fff;
  color:#101044;
}

body{min-height:100vh}

button,input{font:inherit}
button{border:0;cursor:pointer}

.screen{
  display:none;
  min-height:100vh;
}

.screen.active{display:block}

/* START */

.start-screen{
  background:linear-gradient(180deg,#7620df,#f1c8f8);
  padding:35px 18px;
  text-align:center;
  min-height:100vh;
}

.demo-label{
  display:inline-block;
  background:#ffd83d;
  color:#35105d;
  font-size:11px;
  font-weight:900;
  padding:7px 12px;
  border-radius:20px;
  letter-spacing:.4px;
}

.start-screen h1{
  color:#fff;
  font-size:40px;
  margin:25px 0 5px;
}

.subtitle{
  color:#54206e;
  font-size:20px;
  margin-bottom:30px;
}

.plans{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.plan{
  background:#fff;
  border-radius:23px;
  padding:22px 9px;
  box-shadow:0 8px 25px rgba(50,0,80,.2);
}

.plan h2{
  font-size:17px;
  margin:0 0 17px;
}

.price{
  background:linear-gradient(90deg,#7b18d8,#b421df);
  color:#fff;
  font-size:29px;
  font-weight:900;
  padding:13px 3px;
  margin:0 -9px 18px;
}

.plan ul{
  text-align:left;
  padding-left:20px;
  font-size:12px;
  line-height:2;
}

.primary{
  width:100%;
  padding:14px;
  border-radius:30px;
  background:linear-gradient(90deg,#7018d4,#a91cdd);
  color:#fff;
  font-weight:900;
}

.home-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
  margin-top:30px;
}

.big-btn{
  background:#8c1cdb;
  color:#fff;
  border-radius:35px;
  padding:18px 8px;
  font-weight:900;
}

/* PAYMENT */

.payment-screen{
  padding:20px;
  background:linear-gradient(180deg,#8c20dc,#f3cdf8);
}

.card{
  max-width:650px;
  margin:auto;
  background:#fff;
  border-radius:27px;
  padding:22px;
  box-shadow:0 10px 30px rgba(60,0,80,.2);
}

.back{
  background:none;
  color:#541477;
  font-size:20px;
  padding:0;
  margin-bottom:15px;
}

.header{
  display:flex;
  justify-content:space-between;
  gap:15px;
}

.header h2{
  font-size:27px;
  margin:8px 0;
}

.amount{text-align:right}

.amount small{display:block}

.amount strong{
  display:block;
  font-size:29px;
}

.qr-title{
  text-align:center;
  color:#7417c7;
  font-weight:900;
  margin:20px 0 14px;
}

.qr-box{
  max-width:400px;
  margin:auto;
  border:2px solid #ddd;
  border-radius:18px;
  padding:14px;
}

.qr-box img{
  width:100%;
  display:block;
}

.info{
  text-align:center;
  color:#66536e;
  margin:15px 0;
}

.code-box{
  border:2px solid #d9bee7;
  border-radius:18px;
  padding:17px;
}

.code-box h3{
  color:#6616a9;
}

.code-row{
  display:flex;
  gap:9px;
  margin-top:12px;
}

.code-row input{
  flex:1;
  min-width:0;
  padding:13px;
  border:2px solid #d2bedc;
  border-radius:12px;
  outline:none;
}

.unlock{
  background:#6820d6;
  color:#fff;
  border-radius:12px;
  padding:0 15px;
  font-weight:900;
}

.notice{
  display:none;
  margin-top:12px;
  padding:12px;
  border-radius:12px;
  background:#dcffe5;
  color:#147333;
  font-weight:bold;
}

.notice.show{display:block}

/* PAYFAST HOME */

.demo-home{
  background:#fff;
  min-height:100vh;
  padding-bottom:85px;
}

.app-header{
  position:relative;
  color:#fff;
  padding:25px 18px 82px;
  background:linear-gradient(135deg,#4016c9,#7420e3,#9d1be0);
  border-radius:0 0 42px 42px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:11px;
}

.brand-icon{
  width:54px;
  height:54px;
  background:#fff;
  color:#5920d0;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:28px;
  font-weight:900;
}

.brand-name{
  font-size:28px;
  font-weight:900;
}

.brand-sub{
  font-size:15px;
  margin-top:2px;
}

.header-icons{
  display:flex;
  gap:13px;
  align-items:center;
}

.icon-circle{
  width:45px;
  height:45px;
  border-radius:50%;
  background:rgba(255,255,255,.16);
  border:1px solid rgba(255,255,255,.4);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.notify-dot{
  position:absolute;
  width:11px;
  height:11px;
  border-radius:50%;
  background:#ff4b36;
  margin-left:23px;
  margin-top:-25px;
}

.balance-card{
  position:absolute;
  left:18px;
  right:18px;
  bottom:-28px;
  border-radius:27px;
  padding:20px;
  color:#fff;
  background:linear-gradient(135deg,#4214ce,#6520dc);
  border:2px solid rgba(255,255,255,.35);
  box-shadow:0 8px 22px rgba(55,10,140,.28);
}

.balance-top{
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
}

.balance-title{
  display:flex;
  align-items:center;
  gap:9px;
  font-size:18px;
  font-weight:800;
}

.balance-amount{
  font-size:39px;
  font-weight:900;
  margin-top:10px;
}

.cashback{
  text-align:right;
  font-size:20px;
  font-weight:900;
}

.cashback small{
  display:block;
  font-size:12px;
  margin-top:7px;
}

.cashback-pill{
  display:inline-block;
  background:#ffe348;
  color:#3d1765;
  border-radius:20px;
  padding:6px 11px;
  font-size:12px;
  margin-top:8px;
}

.balance-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
  margin-top:17px;
}

.balance-action{
  background:rgba(255,255,255,.12);
  border-radius:16px;
  color:#fff;
  padding:14px;
  text-align:left;
  font-size:16px;
}

.linked{color:#39e59c}

.start-now{
  display:block;
  width:305px;
  max-width:85%;
  margin:0 auto;
  transform:translateY(22px);
  background:linear-gradient(90deg,#5016d0,#7d19dc);
  color:#fff;
  border:2px solid #fff;
  box-shadow:0 5px 15px rgba(70,10,150,.25);
  border-radius:35px;
  padding:14px;
  font-size:25px;
  font-weight:900;
}

.home-content{
  padding:58px 18px 0;
}

.home-section{margin-bottom:25px}

.section-title-row{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.section-title{
  font-size:25px;
  font-weight:900;
  margin:0 0 17px;
}

.refer{
  background:#fff4e9;
  color:#df532c;
  border-radius:25px;
  padding:9px 12px;
  font-size:13px;
  font-weight:800;
}

.transfer-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
}

.transfer{
  text-align:center;
  background:#fff;
  border-radius:18px;
  padding:8px 3px;
}

.transfer-icon{
  width:70px;
  height:70px;
  max-width:100%;
  margin:auto;
  border-radius:50%;
  background:linear-gradient(145deg,#4d16d0,#7920df);
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:31px;
  box-shadow:0 5px 12px rgba(80,15,190,.2);
}

.transfer-name{
  font-size:14px;
  font-weight:800;
  line-height:1.35;
  margin-top:9px;
}

.promo-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.promo{
  border-radius:17px;
  padding:15px;
  font-size:16px;
  font-weight:800;
  min-height:70px;
  display:flex;
  align-items:center;
  gap:10px;
}

.promo.save{
  background:#f0e8ff;
  color:#24144e;
}

.promo.gold{
  background:#fff6d9;
  color:#4e3710;
}

.category-grid{
  display:grid;
  grid-template-columns:repeat(5,1fr);
  gap:9px;
}

.category{
  background:#f6f3fc;
  border-radius:16px;
  padding:12px 4px;
  text-align:center;
  font-weight:800;
  font-size:13px;
}

.category-icon{
  font-size:30px;
  margin-bottom:7px;
}

.loan-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:9px;
}

.loan{
  background:#f6f3fc;
  border-radius:16px;
  padding:14px 4px;
  text-align:center;
  font-size:13px;
  font-weight:800;
}

.loan-icon{
  font-size:30px;
  margin-bottom:7px;
}

.view-all{
  color:#4d16c9;
  font-weight:900;
  font-size:15px;
}

/* TRANSACTIONS */

.transaction{
  background:#fff;
  border-radius:17px;
  box-shadow:0 2px 12px rgba(0,0,0,.07);
  padding:14px;
  display:flex;
  align-items:center;
  gap:12px;
}

.tx-icon{
  width:45px;
  height:45px;
  border-radius:50%;
  background:#5017d0;
  color:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.tx-info{flex:1}

.tx-info strong{
  display:block;
  font-size:16px;
}

.tx-info small{color:#777}

.tx-amount{
  text-align:right;
  color:#15a45a;
  font-weight:900;
}

.tx-amount small{
  display:block;
  color:#777;
  font-weight:normal;
}

/* NAV */

.bottom-nav{
  position:fixed;
  left:0;
  right:0;
  bottom:0;
  height:78px;
  background:#fff;
  border-top:1px solid #eee;
  display:grid;
  grid-template-columns:1fr 1fr 1fr 1fr 1fr;
  align-items:center;
  z-index:100;
  box-shadow:0 -4px 15px rgba(0,0,0,.06);
}

.nav-item{
  text-align:center;
  color:#85859b;
  font-size:12px;
  font-weight:700;
}

.nav-icon{
  font-size:25px;
  margin-bottom:3px;
}

.nav-item.active{color:#5318d1}

.qr-button{
  width:65px;
  height:65px;
  border-radius:50%;
  margin:auto;
  margin-top:-28px;
  background:linear-gradient(145deg,#4a13cb,#7820df);
  color:#fff;
  border:5px solid #fff;
  box-shadow:0 5px 15px rgba(60,10,150,.25);
  font-size:29px;
}

/* FLOW */

.flow-screen{
  min-height:100vh;
  padding:20px;
  background:linear-gradient(180deg,#8c20dc,#f1c8f7);
}

.title{
  font-size:31px;
  margin:10px 0 25px;
}

.field{margin-bottom:16px}

.field label{
  display:block;
  font-weight:800;
